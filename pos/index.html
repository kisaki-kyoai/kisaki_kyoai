<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#453a56"><meta name="apple-mobile-web-app-capable" content="yes"><title>絹彩喜｜レジ</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#292532;background:#f8f6f9}*{box-sizing:border-box}body{margin:0}header{background:#453a56;color:white;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}header strong{font-size:21px}header small{display:block;opacity:.8}main{max-width:1000px;margin:auto;padding:16px}nav{display:flex;gap:8px;margin-bottom:18px}button,input,select{font:inherit;font-size:16px}button{border:0;border-radius:11px;padding:13px 16px;cursor:pointer;background:#e9e3ed;color:#30283c}button.primary{background:#634e77;color:#fff}button:disabled{opacity:.4}nav button.active{background:#634e77;color:#fff}.panel{background:#fff;border:1px solid #e9e5ed;border-radius:15px;padding:16px;margin-bottom:14px;box-shadow:0 2px 7px #00000007}h2{margin:0 0 14px;font-size:19px}h3{margin:8px 0}label{display:block;font-weight:600;margin:10px 0 5px}select,input{width:100%;border:1px solid #cfc8d5;border-radius:9px;padding:12px;background:#fff} .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.flex{display:flex;align-items:center;justify-content:space-between;gap:10px}.big{font-size:28px;font-weight:700}.muted{color:#746d7a;font-size:13px}.line{padding:11px 0;border-bottom:1px solid #eee}.line:last-child{border:0}.danger{color:#a12d42}.good{color:#246f4b}.full{width:100%}.hidden{display:none!important}.notice{padding:10px;background:#fff4d7;border-radius:8px;margin:10px 0}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #eee;text-align:left;padding:9px 5px}th{background:#f5f2f6}.scroll{overflow-x:auto}.pill{display:inline-block;padding:4px 8px;background:#f0eaf4;border-radius:20px;font-size:12px} @media(max-width:520px){.grid{grid-template-columns:1fr}header strong{font-size:18px}main{padding:10px}nav button{padding:11px 8px;flex:1}}
</style></head><body><header><div><small>KISAKI / OFFLINE POS</small><strong>絹彩喜｜貴族時間レジ</strong></div><span id="net" class="pill">確認中</span></header><main><nav><button class="active" data-tab="register">レジ</button><button data-tab="stock">在庫</button><button data-tab="reports">売上・履歴</button></nav><section id="register"><div class="panel"><h2>商品を追加</h2><div class="grid"><div><label>商品</label><select id="kind"><option value="lotion">化粧水 650円</option><option value="cream">クリーム 650円</option><option value="set">化粧水＋クリームセット 1,200円</option></select></div><div><label>数量</label><input id="qty" type="number" min="1" max="999" value="1" inputmode="numeric"></div><div><label id="s1label">化粧水の香り</label><select id="s1"></select></div><div id="s2wrap"><label>クリームの香り</label><select id="s2"></select></div></div><p id="stockHint" class="muted"></p><button id="add" class="primary full">カートに追加</button></div><div class="panel"><h2>お会計</h2><div id="cart"><p class="muted">商品を選択してください。</p></div><div class="flex"><strong>合計</strong><span id="total" class="big">0円</span></div><label>お預かり金（円）</label><input id="cash" type="number" min="0" inputmode="numeric" placeholder="お預かり金を入力"><div class="flex line"><span>お釣り</span><strong id="change">—</strong></div><div id="checkoutError" class="danger"></div><button id="checkout" class="primary full">会計を確定する</button><button id="clear" class="full" style="margin-top:8px">カートを空にする</button></div></section><section id="stock" class="hidden"><div class="panel"><h2>在庫数の設定・補充</h2><p class="muted">各商品の現在庫を設定します。初回はすべて0個です。セットは単品在庫から引き当てます。</p><div id="stockRows"></div><button id="saveStock" class="primary full">在庫数を保存する</button></div></section><section id="reports" class="hidden"><div class="panel"><h2>売上集計</h2><div id="summary"></div><div class="flex" style="flex-wrap:wrap;margin-top:12px"><button id="exportSales">売上CSVを出力</button><button id="exportStock">在庫CSVを出力</button><button id="exportBackup">全データをバックアップ</button></div><label>バックアップから復元（現在の記録を置き換えます）</label><input type="file" id="importBackup" accept="application/json,.json"></div><div class="panel"><h2>会計履歴</h2><div id="history"></div></div></section><p class="muted">売上・在庫はこのiPad内に保存されます。定期的にバックアップを保存してください。Safariのプライベートブラウズでは使用しないでください。</p></main><script src="app.js"></script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#453a56"><meta name="apple-mobile-web-app-capable" content="yes"><title>絹彩喜｜レジ</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#292532;background:#f8f6f9}*{box-sizing:border-box}body{margin:0}header{background:#453a56;color:white;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}header strong{font-size:21px}header small{display:block;opacity:.8}main{max-width:1000px;margin:auto;padding:16px}nav{display:flex;gap:8px;margin-bottom:18px}button,input,select{font:inherit;font-size:16px}button{border:0;border-radius:11px;padding:13px 16px;cursor:pointer;background:#e9e3ed;color:#30283c}button.primary{background:#634e77;color:#fff}button:disabled{opacity:.4}nav button.active{background:#634e77;color:#fff}.panel{background:#fff;border:1px solid #e9e5ed;border-radius:15px;padding:16px;margin-bottom:14px;box-shadow:0 2px 7px #00000007}h2{margin:0 0 14px;font-size:19px}h3{margin:8px 0}label{display:block;font-weight:600;margin:10px 0 5px}select,input{width:100%;border:1px solid #cfc8d5;border-radius:9px;padding:12px;background:#fff} .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.flex{display:flex;align-items:center;justify-content:space-between;gap:10px}.big{font-size:28px;font-weight:700}.muted{color:#746d7a;font-size:13px}.line{padding:11px 0;border-bottom:1px solid #eee}.line:last-child{border:0}.danger{color:#a12d42}.good{color:#246f4b}.full{width:100%}.hidden{display:none!important}.notice{padding:10px;background:#fff4d7;border-radius:8px;margin:10px 0}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #eee;text-align:left;padding:9px 5px}th{background:#f5f2f6}.scroll{overflow-x:auto}.pill{display:inline-block;padding:4px 8px;background:#f0eaf4;border-radius:20px;font-size:12px} @media(max-width:520px){.grid{grid-template-columns:1fr}header strong{font-size:18px}main{padding:10px}nav button{padding:11px 8px;flex:1}}
.product-buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.product-buttons button{min-height:90px;background:#f3eef6;border:2px solid transparent;font-size:18px;line-height:1.5}.product-buttons button.selected,.scent-buttons button.selected{background:#eee5f5;border-color:#634e77;color:#3d2a4e}.scent-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.scent-buttons button{min-height:54px;padding:8px;border:2px solid transparent;background:#f3eef6;font-size:16px}.qty-controls{display:flex;gap:6px;align-items:center}.qty-controls button{min-width:54px;min-height:52px;font-size:23px}.qty-controls input{width:75px;text-align:center}.cash-buttons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:8px 0}.cash-buttons button{padding:12px 5px;min-height:50px;font-weight:600}.large-action{min-height:62px;font-size:20px;font-weight:700}#checkout:disabled{opacity:.45}@media(max-width:600px){.product-buttons button{font-size:15px;min-height:76px}.cash-buttons{grid-template-columns:repeat(3,minmax(0,1fr))}.grid{grid-template-columns:1fr}}
.header-status{display:flex;align-items:flex-end;flex-direction:column;gap:5px}.header-status #clock{font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}.header-status small{font-size:12px;opacity:.9}.header-status .pill{font-size:13px;font-weight:700;padding:6px 12px}.header-status .online{background:#16834d;color:white}.header-status .offline{background:#a3a3a3;color:white}.scent-buttons button{display:flex;align-items:center;justify-content:flex-start;gap:8px;text-align:left}.scent-buttons img{width:43px;height:55px;object-fit:contain;background:white;border-radius:7px}.chosen-images{display:flex;gap:12px;justify-content:center;margin:15px 0}.chosen-images .chosen{width:min(45%,175px);text-align:center;background:#faf8fc;border:1px solid #eee7f2;border-radius:13px;padding:9px}.chosen-images img{height:115px;width:100%;object-fit:contain}.chosen-images .caption{font-size:12px;color:#64566b;margin-top:4px}.product-buttons button{font-weight:600}.daily-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #eee}@media(max-width:520px){.header-status #clock{font-size:17px}.scent-buttons img{width:32px;height:43px}.scent-buttons button{font-size:13px;padding:5px}.chosen-images img{height:90px}}
</style></head><body><header><div><small>KISAKI / OFFLINE POS</small><strong>絹彩喜｜貴族時間レジ</strong></div><div class="header-status">
  <span id="net" class="pill">確認中</span>
  <span id="clock"></span>
  <small id="date"></small>
</div></header><main><nav><button class="active" data-tab="register">レジ</button><button data-tab="stock">在庫</button><button data-tab="reports">売上・履歴</button></nav><section id="register"><div class="panel"><h2>商品を選択</h2><div class="product-buttons"><button type="button" data-kind="lotion">化粧水<br><strong>650円</strong></button><button type="button" data-kind="cream">クリーム<br><strong>650円</strong></button><button type="button" data-kind="set" class="selected">セット<br><strong>1,200円</strong></button></div><select id="kind" class="hidden" aria-label="商品"><option value="lotion">化粧水</option><option value="cream">クリーム</option><option value="set">セット</option></select><div class="chosen-images" id="chosenImages" aria-live="polite"></div><div class="grid"><div><label id="s1label">化粧水の香り</label><div id="s1buttons" class="scent-buttons"></div><select id="s1" class="hidden"></select></div><div id="s2wrap"><label>クリームの香り</label><div id="s2buttons" class="scent-buttons"></div><select id="s2" class="hidden"></select></div></div><div class="flex" style="margin-top:12px"><label for="qty">数量</label><div class="qty-controls"><button type="button" id="qtyMinus">−</button><input id="qty" type="number" min="1" max="999" value="1" inputmode="numeric"><button type="button" id="qtyPlus">＋</button></div></div><p id="stockHint" class="muted"></p><button id="add" class="primary full large-action">＋ カートに追加</button></div><div class="panel"><h2>お会計</h2><div id="cart"><p class="muted">商品を選択してください。</p></div><div class="flex"><strong>合計</strong><span id="total" class="big">0円</span></div><label>お預かり金（円）</label><div class="cash-buttons"><button type="button" data-cash="exact">ちょうど</button><button type="button" data-cash="1000">1,000円</button><button type="button" data-cash="2000">2,000円</button><button type="button" data-cash="5000">5,000円</button><button type="button" data-cash="10000">10,000円</button></div><input id="cash" type="number" min="0" inputmode="numeric" placeholder="お預かり金を入力"><div class="flex line"><span>お釣り</span><strong id="change">—</strong></div><div id="checkoutError" class="danger"></div><button id="checkout" class="primary full large-action">会計を確定する</button><button id="clear" class="full" style="margin-top:8px">カートを空にする</button></div></section><section id="stock" class="hidden"><div class="panel"><h2>在庫数の設定・補充</h2><p class="muted">各商品の現在庫を設定します。初回はすべて0個です。セットは単品在庫から引き当てます。</p><div id="stockRows"></div><button id="saveStock" class="primary full">在庫数を保存する</button></div></section><section id="reports" class="hidden"><div class="panel"><h2>売上集計</h2><div id="summary"></div><div id="dailySummary"></div><div class="flex" style="flex-wrap:wrap;margin-top:12px"><button id="exportSales">売上CSVを出力</button><button id="exportStock">在庫CSVを出力</button><button id="exportBackup">全データをバックアップ</button></div><label>バックアップから復元（現在の記録を置き換えます）</label><input type="file" id="importBackup" accept="application/json,.json"></div><div class="panel"><h2>会計履歴</h2><div id="history"></div></div></section><p class="muted">売上・在庫はこのiPad内に保存されます。定期的にバックアップを保存してください。Safariのプライベートブラウズでは使用しないでください。</p></main><script src="app.js"></script></body></html>

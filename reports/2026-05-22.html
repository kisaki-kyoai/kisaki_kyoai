  <div class="date">2026.05.22　社内会議</div>
  <h1>群馬県の魅力を再発見！</h1>

  <article>
    <p>こんにちは！絹彩喜（きさき）です！</p>

    <p>5月22日に社内会議を行いました。</p>

    <p>
      今回の会議のテーマは「群馬県について知る」です。
      メンバーそれぞれが知っている群馬県の名産品や
      魅力について共有しました。
    </p>

    <p>
      話し合いを進める中で、私たち自身もまだ知らない
      群馬県の魅力がたくさんあることに気づきました。
      そこで、実際に地域の魅力を知るため、
      後日、県内の観光地へ視察に行くことを決定しました。
    </p>

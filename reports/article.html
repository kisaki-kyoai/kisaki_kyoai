
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>活動報告｜絹彩喜</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #faf8f4;
      color: #38342e;
      font-family: "Yu Gothic", "Meiryo", sans-serif;
    }
    header {
      padding: 24px 6%;
      background: #fffdf9;
      border-bottom: 1px solid #e7ded1;
    }
    header a {
      color: #786346;
      text-decoration: none;
      font-size: 17px;
    }
    main {
      max-width: 800px;
      margin: 65px auto;
      padding: 0 24px;
    }
    .category {
      color: #9b8668;
      font-size: 13px;
      letter-spacing: .06em;
    }
    h1 {
      font-size: 30px;
      line-height: 1.5;
      margin: 16px 0 35px;
    }
    .article-image {
      display: block;
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      margin-bottom: 35px;
    }
    .article-content {
      background: #fffdf9;
      border: 1px solid #e7ded1;
      padding: 35px;
    }
    .article-content p {
      font-size: 15px;
      line-height: 2.1;
      margin: 0 0 22px;
    }
    .article-content p:last-child {
      margin-bottom: 0;
    }
    .back {
      display: inline-block;
      margin-top: 35px;
      color: #786346;
      text-decoration: none;
    }
    @media(max-width:700px) {
      main { margin: 40px auto; }
      h1 { font-size: 25px; }
      .article-content { padding: 24px; }
    }
  </style>
</head>
<body>

<header>
  <a href="../index.html">絹彩喜 KISAKI</a>
</header>

<main>
  <div id="article"></div>

  <a class="back" href="index.html">
    ← 活動報告一覧に戻る
  </a>
</main>

<script src="articles.js"></script>
<script>
(function () {
  const id = new URLSearchParams(
    window.location.search
  ).get("id");

  const articles = window.kisakiArticles || [];
  const article = articles.find(item => item.id === id);
  const container = document.getElementById("article");

  if (!article) {
    container.textContent = "記事が見つかりませんでした。";
    return;
  }

  document.title = article.title + "｜絹彩喜";

  const category = document.createElement("div");
  category.className = "category";
  category.textContent =
    article.date + "　" + article.category;

  const title = document.createElement("h1");
  title.textContent = article.title;

  container.append(category, title);

  if (article.image) {
    const img = document.createElement("img");
    img.className = "article-image";
    img.src = article.image;
    img.alt = article.title;
    container.appendChild(img);
  }

  const content = document.createElement("div");
  content.className = "article-content";


  (article.body || []).forEach(item => {
    if (typeof item === "string") {
      const p = document.createElement("p");
      p.textContent = item;
      content.appendChild(p);

    } else if (item.image) {
      const figure = document.createElement("figure");
      figure.style.margin = "28px 0";

      const img = document.createElement("img");
      img.src = item.image;
      img.alt = item.caption || "活動写真";
      img.style.width = "100%";
      img.style.height = "auto";
      img.style.display = "block";
      img.style.borderRadius = "4px";

      figure.appendChild(img);

      if (item.caption) {
        const caption = document.createElement("figcaption");
        caption.textContent = item.caption;
        caption.style.textAlign = "center";
        caption.style.fontSize = "12px";
        caption.style.color = "#9b8668";
        caption.style.marginTop = "10px";
        figure.appendChild(caption);
      }

      content.appendChild(figure);
    }
  });


  container.appendChild(content);
})();
</script>

</body>
</html>

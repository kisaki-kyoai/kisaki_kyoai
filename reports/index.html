
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>活動報告一覧｜絹彩喜</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #faf8f4;
      color: #38342e;
      font-family: "Yu Gothic", "Meiryo", sans-serif;
    }

    header {
      background: #fffdf9;
      border-bottom: 1px solid #e7ded1;
      padding: 24px 6%;
    }

    header a {
      color: #786346;
      text-decoration: none;
      font-size: 17px;
    }

    main {
      max-width: 1050px;
      margin: 65px auto;
      padding: 0 24px;
    }

    .heading span {
      color: #9b8668;
      font-size: 12px;
      letter-spacing: .15em;
    }

    h1 {
      font-size: 30px;
      margin: 12px 0 16px;
    }

    .intro {
      line-height: 1.9;
      margin-bottom: 35px;
    }

    #article-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
    }

    .article-card {
      display: block;
      background: #fffdf9;
      border: 1px solid #e7ded1;
      color: inherit;
      text-decoration: none;
      overflow: hidden;
      transition: border-color .2s;
    }

    .article-card:hover {
      border-color: #a18a68;
    }

    .article-photo {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .no-photo {
      height: 220px;
      background: #eee7dd;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9a8974;
      font-size: 13px;
    }

    .article-body {
      padding: 26px;
    }

    .article-body small {
      color: #9b8668;
      font-size: 12px;
    }

    .article-body h2 {
      font-size: 20px;
      line-height: 1.5;
      margin: 12px 0;
    }

    .article-body p {
      font-size: 14px;
      line-height: 1.9;
    }

    .read-more {
      display: inline-block;
      margin-top: 10px;
      color: #786346;
      border-bottom: 1px solid #b7a38a;
      font-size: 13px;
    }

    #load-more {
      display: none;
      margin: 40px auto 0;
      padding: 15px 55px;
      background: #fffdf9;
      border: 1px solid #a18a68;
      color: #786346;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: background .2s;
    }

    #load-more:hover {
      background: #f4eee5;
    }

    .back {
      display: inline-block;
      margin-top: 45px;
      color: #786346;
      text-decoration: none;
    }

    @media(max-width:700px) {
      main { margin: 40px auto; }
      #article-list { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

<header>
  <a href="../index.html">絹彩喜 KISAKI</a>
</header>

<main>
  <div class="heading">
    <span>ACTIVITY REPORTS</span>
    <h1>活動報告一覧</h1>
  </div>

  <p class="intro">
    絹彩喜のこれまでの活動をご紹介します。
  </p>

  <div id="article-list"></div>

  <button id="load-more" type="button">
    もっと見る
  </button>

  <a class="back" href="../index.html">
    ← トップページに戻る
  </a>
</main>

<script src="articles.js"></script>
<script>
(function () {
  const articles = [...(window.kisakiArticles || [])]
    .sort((a, b) => b.date.localeCompare(a.date));

  const list = document.getElementById("article-list");
  const button = document.getElementById("load-more");

  const pageSize = 10;
  let displayedCount = 0;

  if (articles.length === 0) {
    list.textContent = "活動報告はまだありません。";
    return;
  }

  function createCard(article) {
    const card = document.createElement("a");
    card.className = "article-card";
    card.href = "article.html?id=" +
      encodeURIComponent(article.id);

    if (article.image) {
      const img = document.createElement("img");
      img.className = "article-photo";
      img.src = article.image;
      img.alt = article.title;
      card.appendChild(img);
    } else {
      const placeholder = document.createElement("div");
      placeholder.className = "no-photo";
      placeholder.textContent = "活動写真";
      card.appendChild(placeholder);
    }

    const body = document.createElement("div");
    body.className = "article-body";

    const date = document.createElement("small");
    date.textContent =
      article.date + "　" + article.category;

    const title = document.createElement("h2");
    title.textContent = article.title;

    const description = document.createElement("p");
    description.textContent = article.description;

    const read = document.createElement("span");
    read.className = "read-more";
    read.textContent = "記事を読む →";

    body.append(date, title, description, read);
    card.appendChild(body);

    return card;
  }

  function showMore() {
    const nextArticles = articles.slice(
      displayedCount,
      displayedCount + pageSize
    );

    nextArticles.forEach(article => {
      list.appendChild(createCard(article));
    });

    displayedCount += nextArticles.length;

    button.style.display =
      displayedCount < articles.length
        ? "block"
        : "none";
  }

  button.addEventListener("click", showMore);

  showMore();
})();

</script>


</body>
</html>

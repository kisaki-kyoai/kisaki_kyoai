<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>活動報告一覧｜絹彩喜</title>
<style>
:root{--bg:#faf8f4;--ink:#39342e;--sub:#70685e;--gold:#a18a68;--line:#e5ddd2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.65}a{color:inherit;text-decoration:none}
header{background:#fffdf9;border-bottom:1px solid var(--line);padding:17px max(22px,calc((100vw - 1060px)/2))}.brand{font-family:"Yu Mincho",serif;font-size:23px;letter-spacing:.14em}.back{font-size:12px;color:var(--gold);margin-left:20px}
main{max-width:1060px;margin:0 auto;padding:45px 22px 90px}.eyebrow{font:12px Georgia,serif;letter-spacing:.2em;color:var(--gold)}h1{font-family:"Yu Mincho",serif;font-weight:500;font-size:clamp(26px,4vw,36px);margin:8px 0 6px}.intro{font-size:13px;color:var(--sub);margin:0 0 30px}.count{font-size:12px;color:var(--gold);margin:0 0 12px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{display:flex;min-width:0;min-height:144px;background:#fffdf9;border:1px solid var(--line);overflow:hidden;transition:border-color .2s,transform .2s}.card:hover{border-color:#b9a283;transform:translateY(-2px)}.thumb{width:138px;min-width:138px;background:linear-gradient(140deg,#e8dfd2,#f6f1e8);display:flex;align-items:center;justify-content:center;color:#a18a68;font-family:Georgia,serif;font-size:12px;letter-spacing:.12em}.thumb img{display:block;width:100%;height:100%;object-fit:cover}.content{padding:16px 17px;min-width:0;flex:1}.meta{font-size:11px;color:var(--gold);margin-bottom:7px}.content h2{font-family:"Yu Mincho",serif;font-size:17px;font-weight:500;line-height:1.45;margin:0 0 7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.desc{font-size:12px;color:var(--sub);line-height:1.6;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.more{font-size:11px;color:var(--gold);margin-top:8px}
.empty{padding:28px;background:#fffdf9;border:1px solid var(--line);font-size:14px;color:var(--sub)}
@media(max-width:740px){.cards{grid-template-columns:1fr}.card{min-height:124px}.thumb{width:112px;min-width:112px}.content{padding:12px 14px}.content h2{font-size:16px}.desc{font-size:12px}main{padding:34px 16px 70px}}
@media(max-width:380px){.thumb{width:94px;min-width:94px}.desc{-webkit-line-clamp:1}}
</style>
</head>
<body>
<header><a class="brand" href="/">絹彩喜</a><a class="back" href="/">← トップページへ</a></header>
<main><div class="eyebrow">ACTIVITY REPORTS</div><h1>活動報告一覧</h1><p class="intro">絹彩喜の活動や商品開発の歩みをご紹介します。</p><p class="count" id="count"></p><div class="cards" id="cards"><p class="empty">活動報告を読み込んでいます…</p></div></main>
<script src="articles.js"></script>
<script>
(function(){
 const target=document.getElementById('cards'),count=document.getElementById('count');
 const articles=Array.isArray(window.kisakiArticles)?[...window.kisakiArticles].sort((a,b)=>String(b.date).localeCompare(String(a.date))):[];
 target.replaceChildren();
 if(!articles.length){target.innerHTML='<p class="empty">活動報告を読み込めませんでした。reports/articles.js の内容をご確認ください。</p>';return;}
 count.textContent=articles.length+'件の活動報告';
 for(const a of articles){
  const link=document.createElement('a');link.className='card';link.href='article.html?id='+encodeURIComponent(a.id);
  const thumb=document.createElement('div');thumb.className='thumb';
  if(a.image){const img=document.createElement('img');img.loading='lazy';img.alt='';img.src=/^https?:\/\//i.test(a.image)?a.image:a.image;img.onerror=()=>{thumb.textContent='KISAKI'};thumb.appendChild(img)}else{thumb.textContent='KISAKI'}
  const content=document.createElement('div');content.className='content';
  const meta=document.createElement('div');meta.className='meta';meta.textContent=(a.date||'')+'  /  '+(a.category||'活動報告');
  const title=document.createElement('h2');title.textContent=a.title||'活動報告';
  const desc=document.createElement('p');desc.className='desc';desc.textContent=a.description||'';
  const more=document.createElement('div');more.className='more';more.textContent='記事を読む ›';
  content.append(meta,title,desc,more);link.append(thumb,content);target.appendChild(link);
 }
})();
</script>
</body></html>
